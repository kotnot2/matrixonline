<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор Мультиплеер — Игра</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(145deg, #0b1a2e, #1a2f44);
            min-height: 100vh;
            padding: 12px;
            color: #e3f0ff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        /* Верхняя панель */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(15, 31, 48, 0.8);
            padding: 10px 20px;
            border-radius: 40px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 16px;
        }
        .room-info {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 0.9rem;
            color: #b3d6f0;
        }
        .room-info .code {
            background: #0f2337;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 700;
            color: #b3e0ff;
            letter-spacing: 2px;
        }
        .timer-box {
            background: #0f1f30;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #b3e0ff;
            border: 1px solid #2d4b66;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
            min-width: 100px;
            text-align: center;
        }
        .timer-box.warning { color: #ffb07c; border-color: #b07040; }
        .timer-box.finished { color: #ff6b6b; border-color: #ff4444; }
        .game-status {
            padding: 4px 16px;
            border-radius: 20px;
            background: #223f5a;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .game-status.racing { background: #d48c3c; color: #fff6e0; }
        .game-status.finished { background: #6d3f4a; color: #ffd9d9; }

        /* Игроки */
        .players-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        @media (max-width: 650px) {
            .players-grid { grid-template-columns: 1fr; }
        }
        .player-card {
            background: #172d42;
            border-radius: 30px;
            padding: 14px;
            box-shadow: inset 0 -4px 0 #0b1a2a, 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
        }
        .player-card.winner {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #2f4b66;
            margin-bottom: 12px;
        }
        .player-name {
            font-weight: 700;
            font-size: 1.2rem;
        }
        .player-score {
            background: #0f2337;
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.4rem;
            color: #b3e0ff;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.6);
        }
        .display {
            background: #0f1f30;
            border-radius: 20px;
            padding: 10px 14px;
            margin-bottom: 12px;
            text-align: right;
            font-size: 1.8rem;
            font-weight: 600;
            min-height: 56px;
            border: 1px solid #2d4b66;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-break: break-all;
        }
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .btn {
            background: #223f5a;
            border: none;
            border-radius: 20px;
            padding: 12px 0;
            font-size: 1.2rem;
            font-weight: 600;
            color: #eaf5ff;
            box-shadow: 0 4px 0 #0a1a2a;
            cursor: pointer;
            transition: all 0.07s ease;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a1a2a; }
        .btn:disabled {
            opacity: 0.4;
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a1a2a;
            pointer-events: none;
        }
        .btn-function { background: #2c4d6e; }
        .btn-equals { background: #d48c3c; box-shadow: 0 4px 0 #7a4f1e; color: #fff6e0; }
        .btn-clear { background: #6d3f4a; box-shadow: 0 4px 0 #3d232a; color: #ffd9d9; }
        .btn-zero { grid-column: span 2; }

        /* Чат */
        .chat-area {
            background: #0f1f30;
            border-radius: 30px;
            padding: 12px 16px;
            border: 1px solid #2d4b66;
            margin-bottom: 12px;
        }
        .chat-messages {
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            scrollbar-width: thin;
            scrollbar-color: #3f6080 #0a1a2a;
        }
        .chat-messages div {
            font-size: 0.85rem;
            padding: 2px 0;
            border-bottom: 1px solid #1f3950;
        }
        .chat-messages .system { color: #d4a86a; font-style: italic; }
        .chat-messages .player { color: #8fcbff; }
        .chat-input-row {
            display: flex;
            gap: 8px;
        }
        .chat-input-row input {
            flex: 1;
            background: #0a1a2a;
            border: 1px solid #2f4b66;
            border-radius: 30px;
            padding: 8px 16px;
            color: #e3f0ff;
            outline: none;
            font-size: 0.9rem;
        }
        .chat-input-row input:focus { border-color: #70a0c0; }
        .chat-input-row button {
            background: #223f5a;
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            color: #e3f0ff;
            font-weight: 600;
            box-shadow: 0 3px 0 #0b1a2a;
            cursor: pointer;
            transition: 0.07s ease;
        }
        .chat-input-row button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0b1a2a; }

        /* Кнопки управления */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }
        .ctrl-btn {
            background: #1f3950;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            color: #b3d6f0;
            box-shadow: 0 4px 0 #0b1a2a;
            cursor: pointer;
            transition: 0.07s ease;
            border: 1px solid #3f6080;
            font-size: 0.9rem;
        }
        .ctrl-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0b1a2a; }
        .ctrl-btn.primary { background: #d48c3c; color: #fff6e0; box-shadow: 0 4px 0 #7a4f1e; }
        .ctrl-btn.danger { background: #6d3f4a; color: #ffd9d9; box-shadow: 0 4px 0 #3d232a; }

        .footer {
            text-align: center;
            margin-top: 12px;
            color: #3f6480;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Верхняя панель -->
        <div class="top-bar">
            <div class="room-info">
                <span>🏠 Комната</span>
                <span class="code" id="roomCode">------</span>
                <span class="game-status" id="gameStatus">⏳ Ожидание</span>
            </div>
            <div class="timer-box" id="timerDisplay">⏱ 1:00</div>
        </div>

        <!-- Игроки -->
        <div class="players-grid" id="playersGrid">
            <!-- Игрок 1 (свой) -->
            <div class="player-card" id="myCard">
                <div class="player-header">
                    <span class="player-name" id="myName">Вы</span>
                    <span class="player-score" id="myScore">0</span>
                </div>
                <div class="display" id="myDisplay">0</div>
                <div class="buttons-grid" id="myButtons">
                    <button class="btn btn-clear" data-action="clear">C</button>

                    <button class="btn btn-function" data-action="operator" data-value="/">÷</button>
                    <button class="btn btn-function" data-action="operator" data-value="*">×</button>
                    <button class="btn" data-action="digit" data-value="7">7</button>
