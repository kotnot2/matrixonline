<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор Мультиплеер — Игра</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(145deg, #0b1a2e, #1a2f44);
            min-height: 100vh;
            padding: 12px;
            color: #e3f0ff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(15, 31, 48, 0.8);
            padding: 10px 20px;
            border-radius: 40px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 16px;
        }
        .room-info {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 0.9rem;
            color: #b3d6f0;
            flex-wrap: wrap;
        }
        .room-info .code {
            background: #0f2337;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 700;
            color: #b3e0ff;
            letter-spacing: 2px;
        }
        .timer-box {
            background: #0f1f30;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #b3e0ff;
            border: 1px solid #2d4b66;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
            min-width: 100px;
            text-align: center;
        }
        .timer-box.warning { color: #ffb07c; border-color: #b07040; }
        .timer-box.finished { color: #ff6b6b; border-color: #ff4444; }
        .game-status {
            padding: 4px 16px;
            border-radius: 20px;
            background: #223f5a;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .game-status.racing { background: #d48c3c; color: #fff6e0; }
        .game-status.finished { background: #6d3f4a; color: #ffd9d9; }

        .players-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        @media (max-width: 650px) {
            .players-grid { grid-template-columns: 1fr; }
        }
        .player-card {
            background: #172d42;
            border-radius: 30px;
            padding: 14px;
            box-shadow: inset 0 -4px 0 #0b1a2a, 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
        }
        .player-card.winner {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #2f4b66;
            margin-bottom: 12px;
        }
        .player-name {
            font-weight: 700;
            font-size: 1.2rem;
        }
        .player-score {
            background: #0f2337;
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.4rem;
            color: #b3e0ff;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.6);
        }
        .display {
            background: #0f1f30;
            border-radius: 20px;
            padding: 10px 14px;
            margin-bottom: 12px;
            text-align: right;
            font-size: 1.8rem;
            font-weight: 600;
            min-height: 56px;
            border: 1px solid #2d4b66;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-break: break-all;
        }
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .btn {
            background: #223f5a;
            border: none;
            border-radius: 20px;
            padding: 12px 0;
            font-size: 1.2rem;
            font-weight: 600;
            color: #eaf5ff;
            box-shadow: 0 4px 0 #0a1a2a;
            cursor: pointer;
            transition: all 0.07s ease;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a1a2a; }
        .btn:disabled {
            opacity: 0.4;
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a1a2a;
            pointer-events: none;
        }
        .btn-function { background: #2c4d6e; }
        .btn-equals { background: #d48c3c; box-shadow: 0 4px 0 #7a4f1e; color: #fff6e0; }
        .btn-clear { background: #6d3f4a; box-shadow: 0 4px 0 #3d232a; color: #ffd9d9; }
        .btn-zero { grid-column: span 2; }

        .chat-area {
            background: #0f1f30;
            border-radius: 30px;
            padding: 12px 16px;
            border: 1px solid #2d4b66;
            margin-bottom: 12px;
        }
        .chat-messages {
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            scrollbar-width: thin;
            scrollbar-color: #3f6080 #0a1a2a;
        }
        .chat-messages div {
            font-size: 0.85rem;
            padding: 2px 0;
            border-bottom: 1px solid #1f3950;
        }
        .chat-messages .system { color: #d4a86a; font-style: italic; }
        .chat-messages .player { color: #8fcbff; }
        .chat-input-row {
            display: flex;
            gap: 8px;
        }
        .chat-input-row input {
            flex: 1;
            background: #0a1a2a;
            border: 1px solid #2f4b66;
            border-radius: 30px;
            padding: 8px 16px;
            color: #e3f0ff;
            outline: none;
            font-size: 0.9rem;
        }
        .chat-input-row input:focus { border-color: #70a0c0; }
        .chat-input-row button {
            background: #223f5a;
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            color: #e3f0ff;
            font-weight: 600;
            box-shadow: 0 3px 0 #0b1a2a;
            cursor: pointer;
            transition: 0.07s ease;
        }
        .chat-input-row button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0b1a2a; }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }
        .ctrl-btn {
            background: #1f3950;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            color: #b3d6f0;
            box-shadow: 0 4px 0 #0b1a2a;
            cursor: pointer;
            transition: 0.07s ease;
            border: 1px solid #3f6080;
            font-size: 0.9rem;
        }
        .ctrl-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0b1a2a; }
        .ctrl-btn.primary { background: #d48c3c; color: #fff6e0; box-shadow: 0 4px 0 #7a4f1e; }
        .ctrl-btn.danger { background: #6d3f4a; color: #ffd9d9; box-shadow: 0 4px 0 #3d232a; }
        .ctrl-btn:disabled { opacity: 0.5; transform: translateY(3px); box-shadow: 0 1px 0 #0b1a2a; pointer-events: none; }

        .footer {
            text-align: center;
            margin-top: 12px;
            color: #3f6480;
            font-size: 0.7rem;
        }
        .opponent-placeholder {
            text-align: center;
            color: #3b5b79;
            padding: 20px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="room-info">
                <span>🏠 Комната</span>
                <span class="code" id="roomCode">------</span>
                <span class="game-status" id="gameStatus">⏳ Ожидание</span>
            </div>
            <div class="timer-box" id="timerDisplay">⏱ 1:00</div>
        </div>

        <div class="players-grid" id="playersGrid">
            <div class="player-card" id="myCard">
                <div class="player-header">
                    <span class="player-name" id="myName">Вы</span>
                    <span class="player-score" id="myScore">0</span>
                </div>
                <div class="display" id="myDisplay">0</div>
                <div class="buttons-grid" id="myButtons">
                    <button class="btn btn-clear" data-action="clear">C</button>
                    <button class="btn btn-function" data-action="operator" data-value="%">%</button>
                    <button class="btn btn-function" data-action="operator" data-value="/">÷</button>
                    <button class="btn btn-function" data-action="operator" data-value="*">×</button>
                    <button class="btn" data-action="digit" data-value="7">7</button>
                    <button class="btn" data-action="digit" data-value="8">8</button>
                    <button class="btn" data-action="digit" data-value="9">9</button>
                    <button class="btn btn-function" data-action="operator" data-value="-">−</button>
                    <button class="btn" data-action="digit" data-value="4">4</button>
                    <button class="btn" data-action="digit" data-value="5">5</button>
                    <button class="btn" data-action="digit" data-value="6">6</button>
                    <button class="btn btn-function" data-action="operator" data-value="+">+</button>
                    <button class="btn" data-action="digit" data-value="1">1</button>
                    <button class="btn" data-action="digit" data-value="2">2</button>
                    <button class="btn" data-action="digit" data-value="3">3</button>
                    <button class="btn btn-equals" data-action="equals">=</button>
                    <button class="btn btn-zero" data-action="digit" data-value="0">0</button>
                    <button class="btn" data-action="digit" data-value=".">.</button>
                    <button class="btn btn-function" data-action="backspace">⌫</button>
                </div>
            </div>

            <div class="player-card" id="opponentCard">
                <div class="player-header">
                    <span class="player-name" id="opponentName">Оппонент</span>
                    <span class="player-score" id="opponentScore">0</span>
                </div>
                <div class="display" id="opponentDisplay">0</div>
                <div class="opponent-placeholder" id="opponentPlaceholder">
                    ⏳ Ожидание соперника...
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <div class="system">💬 Добро пожаловать в игру!</div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="Сообщение..." maxlength="60">
                <button id="chatSendBtn">Отправить</button>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn primary" id="startRaceBtn">🏁 Старт гонки</button>
            <button class="ctrl-btn" id="resetScoresBtn">🔄 Сбросить счёт</button>
            <button class="ctrl-btn danger" id="resetGameBtn">🆕 Новая игра</button>
            <button class="ctrl-btn" id="leaveBtn">🚪 Выйти</button>
        </div>

        <div class="footer">калькулятор мультиплеер · гонка 60 секунд</div>
    </div>

    <script>
        const WS_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'ws://localhost:8765' 
            : `ws://${window.location.hostname}:8765`;

        let ws = null;
        let playerId = localStorage.getItem('player_id');
        let roomId = localStorage.getItem('room_id');
        let playerName = localStorage.getItem('player_name') || 'Игрок';
        let myScore = 0;
        let opponentScore = 0;
        let myDisplay = '0';
        let opponentDisplay = '0';
        let gameState = 'waiting';
        let timer = 60;
        let isRacing = false;
        let reconnectAttempts = 0;

        const myNameEl = document.getElementById('myName');
        const myScoreEl = document.getElementById('myScore');
        const myDisplayEl = document.getElementById('myDisplay');
        const opponentNameEl = document.getElementById('opponentName');
        const opponentScoreEl = document.getElementById('opponentScore');
        const opponentDisplayEl = document.getElementById('opponentDisplay');
        const opponentPlaceholder = document.getElementById('opponentPlaceholder');
        const roomCodeEl = document.getElementById('roomCode');
        const gameStatusEl = document.getElementById('gameStatus');
        const timerDisplay = document.getElementById('timerDisplay');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const startRaceBtn = document.getElementById('startRaceBtn');
        const resetScoresBtn = document.getElementById('resetScoresBtn');
        const resetGameBtn = document.getElementById('resetGameBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const myButtons = document.getElementById('myButtons');
        const opponentCard = document.getElementById('opponentCard');

        function connect() {
            if (!roomId || !playerId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = function() {
                    console.log('Подключено к серверу');
                    reconnectAttempts = 0;
                    ws.send(JSON.stringify({
                        type: 'join',
                        name: playerName,
                        room_id: roomId
                    }));
                };

                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        handleMessage(data);
                    } catch (e) {
                        console.error('Ошибка парсинга:', e);
                    }
                };

                ws.onerror = function() {
                    addChatMessage('⚠️ Ошибка соединения с сервером', 'system');
                };

                ws.onclose = function() {
                    if (reconnectAttempts < 5) {
                        reconnectAttempts++;
                        addChatMessage(`🔌 Переподключение... (${reconnectAttempts}/5)`, 'system');
                        setTimeout(connect, 3000);
                    } else {
                        addChatMessage('❌ Не удалось переподключиться. Перезагрузите страницу.', 'system');
                    }
                };
            } catch (e) {
                addChatMessage('❌ Ошибка: ' + e.message, 'system');
            }
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'init':
                    roomCodeEl.textContent = data.room_id;
                    gameState = data.game_state;
                    updateGameState();
                    updatePlayers(data.players);
                    if (data.messages) {
                        data.messages.forEach(msg => {
                            addChatMessage(`${msg.name}: ${msg.text}`, 'player');
                        });
                    }
                    break;

                case 'player_joined':
                    updatePlayers(data.players);
                    addChatMessage(`👤 ${data.name} присоединился`, 'system');
                    break;

                case 'player_left':
                    updatePlayers(data.players);
                    addChatMessage(`👤 Игрок покинул комнату`, 'system');
                    break;

                case 'chat':
                    addChatMessage(`${data.name}: ${data.text}`, 'player');
                    break;

                case 'calculator_update':
                    if (data.player_id === playerId) {
                        myDisplay = data.display || '0';
                        myDisplayEl.textContent = myDisplay;
                        myScore = data.score || 0;
                        myScoreEl.textContent = myScore;
                    } else {
                        opponentDisplay = data.display || '0';
                        opponentDisplayEl.textContent = opponentDisplay;
                        opponentScore = data.score || 0;
                        opponentScoreEl.textContent = opponentScore;
                    }
                    break;

                case 'race_started':
                    gameState = 'racing';
                    timer = data.timer;
                    updateGameState();
                    addChatMessage('🏁 ГОНКА НАЧАЛАСЬ! 60 секунд.', 'system');
                    break;

                case 'timer_update':
                    timer = data.timer;
                    updateTimer();
                    break;

                case 'race_finished':
                    gameState = 'finished';
                    updateGameState();
                    updatePlayers(data.players);
                    if (data.winner === playerId) {
                        addChatMessage('🏆 ВЫ ПОБЕДИЛИ! Поздравляем!', 'system');
                        document.getElementById('myCard').classList.add('winner');
                    } else if (data.winner) {
                        addChatMessage(`🏆 ${data.winner_name} победил!`, 'system');
                        opponentCard.classList.add('winner');
                    } else {
                        addChatMessage('🤝 Ничья!', 'system');
                    }
                    break;

                case 'scores_reset':
                    updatePlayers(data.players);
                    addChatMessage('🔄 Счёт сброшен', 'system');
                    break;

                case 'game_reset':
                    gameState = data.game_state;
                    updateGameState();
                    updatePlayers(data.players);
                    document.getElementById('myCard').classList.remove('winner');
                    opponentCard.classList.remove('winner');
                    timer = 60;
                    updateTimer();
                    addChatMessage('🆕 Новая игра', 'system');
                    break;

                default:
                    console.log('Неизвестный тип:', data.type);
            }
        }

        function updatePlayers(players) {
            const playerIds = Object.keys(players);
            if (playerIds.length === 0) return;

            let myId = playerId;
            let opponentId = null;
            for (const pid of playerIds) {
                if (pid !== myId) {
                    opponentId = pid;
                    break;
                }
            }

            if (players[myId]) {
                myNameEl.textContent = players[myId].name + ' (Вы)';
                myScoreEl.textContent = players[myId].score;
                myScore = players[myId].score;
            }

            if (opponentId && players[opponentId]) {
                opponentNameEl.textContent = players[opponentId].name;
                opponentScoreEl.textContent = players[opponentId].score;
                opponentScore = players[opponentId].score;
                opponentDisplayEl.textContent = opponentDisplay;
                opponentPlaceholder.style.display = 'none';
                opponentDisplayEl.style.display = 'flex';
            } else {
                opponentNameEl.textContent = 'Ожидание...';
                opponentScoreEl.textContent = '0';
                opponentPlaceholder.style.display = 'block';
                opponentDisplayEl.style.display = 'none';
            }

            const count = playerIds.length;
            gameStatusEl.textContent = count >= 2 ? `👥 ${count} игроков` : `👤 ${count} игрок (ждём)`;
            startRaceBtn.disabled = count < 2 || gameState !== 'waiting';
        }

        function updateGameState() {
            if (gameState === 'waiting') {
                gameStatusEl.textContent = '⏳ Ожидание';
                gameStatusEl.className = 'game-status';
                startRaceBtn.disabled = false;
                myButtons.querySelectorAll('.btn').forEach(b => b.disabled = false);
            } else if (gameState === 'racing') {
                gameStatusEl.textContent = '🏁 Гонка!';
                gameStatusEl.className = 'game-status racing';
                startRaceBtn.disabled = true;
                myButtons.querySelectorAll('.btn').forEach(b => b.disabled = false);
            } else if (gameState === 'finished') {
                gameStatusEl.textContent = '🏁 Завершено';
                gameStatusEl.className = 'game-status finished';
                startRaceBtn.disabled = true;
                myButtons.querySelectorAll('.btn').forEach(b => b.disabled = true);
            }
        }

        function updateTimer() {
            timerDisplay.textContent = `⏱ ${timer}:00`;
            timerDisplay.classList.remove('warning', 'finished');
            if (timer <= 10 && timer > 0) timerDisplay.classList.add('warning');
            if (timer <= 0) timerDisplay.classList.add('finished');
        }

        function addChatMessage(text, cls = '') {
            const div = document.createElement('div');
            div.textContent = text;
            if (cls) div.className = cls;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            if (chatMessages.children.length > 50) {
                chatMessages.removeChild(chatMessages.children[0]);
            }
        }

        function sendChatMessage() {
            const text = chatInput.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({
                type: 'chat',
                text: text
            }));
            chatInput.value = '';
        }

        function sendCalculatorAction(action, value = null) {
            if (!ws || ws.readyState !== WebSocket.OPEN || gameState === 'finished') return;
            ws.send(JSON.stringify({
                type: 'calculator',
                action: action,
                value: value
            }));
        }

        myButtons.addEventListener('click', function(e) {
            const btn = e.target.closest('.btn');
            if (!btn || btn.disabled) return;
            const action = btn.dataset.action;
            const value = btn.dataset.value;
            sendCalculatorAction(action, value);
        });

        chatSendBtn.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        startRaceBtn.addEventListener('click', function() {
            if (ws && ws.readyState === WebSocket.OPEN && gameState === 'waiting') {
                ws.send(JSON.stringify({ type: 'start_race' }));
            }
        });

        resetScoresBtn.addEventListener('click', function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'reset_scores' }));
            }
        });

        resetGameBtn.addEventListener('click', function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'reset_game' }));
            }
            document.getElementById('myCard').classList.remove('winner');
            opponentCard.classList.remove('winner');
            timer = 60;
            updateTimer();
        });

        leaveBtn.addEventListener('click', function() {
            if (ws) ws.close();
            localStorage.clear();
            window.location.href = 'index.html';
        });

        if (!roomId || !playerId) {
            window.location.href = 'index.html';
        } else {
            myNameEl.textContent = playerName + ' (Вы)';
            roomCodeEl.textContent = roomId;
            connect();
            updateTimer();
        }
    </script>
</body>
</html>
